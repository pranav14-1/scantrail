name: scantrail
description: "ScanTrail: Spatial-Temporal Road Defect Tracking & Analysis System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.5.0
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  path_provider: ^2.1.3
  open_file: ^3.3.2
  mqtt_client: ^9.6.0
  image_picker: ^1.2.0
  intl: ^0.20.2
  animated_bottom_navigation_bar: ^1.3.3
  shared_preferences: ^2.5.3
  flutter_dotenv: ^6.0.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  isar_generator: ^3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - .env
